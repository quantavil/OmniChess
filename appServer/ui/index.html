<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws://localhost:*; img-src 'self' data: blob:;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Local chess engine WebSocket server for OmniChess GUI.">
    <link rel="stylesheet" href="./css/bootstrap.css">
    <link rel="stylesheet" href="./css/omnichess-toast.css">
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/custom-scroll.css">
    <link rel="preload" href="./fonts/Mona-Sans.woff2" as="font" type="font/woff2">
    <link rel="preload" href="./fonts/Rubik.ttf" as="font" type="font/ttf">
    <link rel="preload" href="./fonts/IBMPlexSans.ttf" as="font" type="font/ttf">
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="./favicon.ico"/>
</head>

<body>
<div id="omnichess-header">
    <a id="omnichess-logo" class="external" href="https://quantavil.github.io/OmniChess/" target="_blank">
        <img id="omnichess-logo-img" src="./images/logo.png">
        <div id="omnichess-logo-text-container">
            <div id="omnichess-logo-main">OmniChess<div id="omnichess-version-tag">V2</div></div>
            <div id="omnichess-logo-secondary">Calculation Server</div>
        </div>
    </a>
    <div id="omnichess-is-free-reminder">
        <span>(´｡• ◡ •｡`) Psst! ♡ ⤵</span>
        <div class="omnichess-social-actions">
            <a class="header-social-button github-button omnichess-fancy-button external" href="https://github.com/quantavil/OmniChess" target="_blank" title="Star OmniChess on GitHub">
                <i class="bi bi-github"></i>
            </a>
        </div>
    </div>
</div>
<header>
    <div class="header-buttons-container">
        <div>
            <button id="addEngineBtn" class="omnichess-fancy-button"><i class="bi bi-plus-lg"></i> ADD ENGINE BINARY</button>
            <input 
                type="file" 
                id="filePicker" 
                accept=".exe, .bin, .so, .dylib, application/octet-stream" 
            />

        </div>
        <button id="stopBtn" class="omnichess-fancy-button"><i class="bi bi-x-lg"></i> KILL ENGINES</button>
        <button id="clearBtn" class="omnichess-fancy-button"><i class="bi bi-x-lg"></i> CLEAR CACHE</button>
    </div>
    <div class="server-info omnichess-fancy-button">
        <div id="statusDot"></div>
        <span id="portDisplay">OFFLINE</span>
    </div>
</header>

<div class="engine-grid" id="engineGrid"></div>
<div id="consoles-container"></div>

<div id="omnichess-toast-container"></div>
<script src="./libs/omnichessToast.js"></script>
<script src="./libs/omnichessPrompt.js"></script>

<script src="./js/utils.js"></script>
<script src="./js/console.js"></script>
<script src="./index.js"></script>

</body>
</html>
